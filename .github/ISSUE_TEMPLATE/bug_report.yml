name: Bug report
description: Something is broken in install, tests, API, or UI
title: "[bug] "
labels: ["bug", "good first issue"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping. Follow only the README from a fresh clone when reporting setup failures.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact commands, starting from a clean clone.
      placeholder: |
        git clone https://github.com/Inkithai/Oyster360.git
        cd Oyster360
        cp .env.example .env
        ...
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, Python, Node, Docker versions"
