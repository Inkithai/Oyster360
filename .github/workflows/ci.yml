name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, "arena/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfiles:
    name: Lockfile reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: uv lock --check (root PEP 621 manifest)
        run: |
          if [ -f uv.lock ]; then
            uv lock --check
          else
            echo "root uv.lock not present; skip"
          fi

      - name: uv lock --check (backend)
        working-directory: backend
        run: |
          if [ -f uv.lock ]; then
            uv lock --check
          else
            echo "backend/uv.lock not present; skip"
          fi

      - name: Fail if backend lockfile is out of sync with requirements.txt
        working-directory: backend
        run: |
          pip install pip-tools
          pip-compile --no-emit-index-url --strip-extras \
            --output-file=requirements.lock requirements.txt
          git diff --exit-code -- requirements.lock || {
            echo "::error::backend/requirements.lock does not match requirements.txt."
            echo "Regenerate it with:"
            echo "  cd backend && pip-compile --no-emit-index-url --strip-extras \\"
            echo "    --output-file=requirements.lock requirements.txt"
            exit 1
          }

      - name: Verify locked backend dependencies are installable from scratch
        working-directory: backend
        run: pip install --dry-run -r requirements.lock

      - name: Verify frontend lockfile matches package.json
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json || {
            echo "::error::frontend/package-lock.json does not match package.json."
            echo "Regenerate it with: cd frontend && npm install"
            exit 1
          }

  backend:
    name: Lint, typecheck, and test backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lockfiles]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install locked dependencies
        working-directory: backend
        run: pip install -r requirements.lock

      - name: Lint backend (flake8)
        working-directory: backend
        run: flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,__pycache__,alembic/versions

      - name: Run fast unit tests (no external services)
        working-directory: backend
        run: pytest -m "not integration" -q

      - name: Test backend with coverage gate (>= 60%)
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=60

  frontend:
    name: Lint, typecheck, and test frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lockfiles]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Test frontend with coverage gate (npm run test:coverage)
        working-directory: frontend
        run: |
          if npm run | grep -q "test:coverage"; then
            npm run test:coverage
          else
            npx vitest run --coverage
          fi

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-integration:
    name: Docker compose test stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - name: Validate production Compose configuration
        run: docker compose config --quiet

      - name: Run isolated Compose test stack (full suite incl. integration-marked tests)
        run: |
          trap 'docker compose -f docker-compose.test.yml down --volumes --remove-orphans' EXIT
          docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from test-runner

  security:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lockfiles]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - name: Block committed environment files
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.local|\.production)?$'; then
            echo "Environment files must not be committed. Use .env.example instead."
            exit 1
          fi

      - name: Set up Python for dependency resolution
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend dependencies (so Trivy resolves the full lockfile)
        working-directory: backend
        run: pip install -r requirements.lock

      - name: Set up Node.js for dependency resolution
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install frontend dependencies (so Trivy resolves node_modules)
        working-directory: frontend
        run: npm ci

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run filesystem vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          scanners: vuln
          exit-code: "1"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker-integration, security]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deployment placeholder
        run: echo "Configure the production deployment provider here"
