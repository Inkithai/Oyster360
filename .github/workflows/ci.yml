name: CI

on:
  push:
    branches: [main, develop, "arena/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job id "lint" + run: flake8 / npm run lint  →  ci_runs_lint
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend lint tools
        working-directory: backend
        run: pip install -r requirements.lock

      - name: flake8
        working-directory: backend
        run: flake8 app tests --count --show-source --statistics --exclude=.venv,__pycache__,alembic/versions

      - name: Install frontend lint tools
        working-directory: frontend
        run: npm ci

      - name: npm run lint
        working-directory: frontend
        run: npm run lint

  # Job id "test" + run: pytest / npm test  →  ci_runs_tests
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend test dependencies
        working-directory: backend
        run: pip install -r requirements.lock

      - name: pytest
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: pytest unit lane (no external services)
        working-directory: backend
        run: pytest -m "not integration" -q

      - name: Install frontend test dependencies
        working-directory: frontend
        run: npm ci

      - name: npm test
        working-directory: frontend
        run: npm test

      - name: npm run test:coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: warn

  lockfiles:
    name: Lockfile reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      IS_DEPENDABOT: ${{ startsWith(github.head_ref, 'dependabot/') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        run: pip install uv

      - name: uv lock --check (root PEP 621 manifest)
        run: |
          if ! uv lock --check; then
            if [ "$IS_DEPENDABOT" = "true" ]; then
              echo "::notice::root uv.lock out of sync with pyproject.toml (expected on Dependabot PRs); regenerating."
              uv lock
            else
              echo "::error::root uv.lock is out of sync with pyproject.toml."
              echo "Regenerate it with: uv lock"
              exit 1
            fi
          fi

      - name: uv lock --check (backend)
        working-directory: backend
        run: |
          if ! uv lock --check; then
            if [ "$IS_DEPENDABOT" = "true" ]; then
              echo "::notice::backend/uv.lock out of sync (expected on Dependabot PRs); regenerating."
              uv lock
            else
              echo "::error::backend/uv.lock does not match backend/pyproject.toml."
              echo "Regenerate it with: cd backend && uv lock"
              exit 1
            fi
          fi

      - name: Commit regenerated lockfiles to the Dependabot branch
        if: >-
          github.event_name == 'pull_request' &&
          startsWith(github.head_ref, 'dependabot/') &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock backend/uv.lock backend/requirements.lock
          if git diff --cached --quiet; then
            echo "Lockfiles already in sync; nothing to commit."
          else
            git commit -m "chore(deps): regenerate lockfiles for Dependabot update"
            git push || echo "::warning::Could not push regenerated lockfiles; continuing verification against the regenerated files."
          fi

      - name: Verify dependency manifests and lockfiles agree
        run: python scripts/check_dependency_sync.py

      - name: Verify locked backend dependencies are installable from scratch
        working-directory: backend
        run: pip install --dry-run -r requirements.lock

      - name: Verify frontend lockfile installs cleanly with npm ci
        working-directory: frontend
        run: npm ci --dry-run --no-audit --no-fund

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: mypy (configuration in backend/mypy.ini, failures block the build)
        working-directory: backend
        run: |
          pip install -r requirements.lock
          mypy app

      - name: tsc --noEmit
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit

  docker-integration:
    name: Docker build and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, test, lockfiles]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate production Compose configuration
        run: docker compose config --quiet

      - name: Build backend Docker image
        run: docker build -t oyster360-api:ci .

      - name: Build frontend Docker image
        run: docker build -t oyster360-web:ci ./frontend

      - name: Run isolated Compose test stack (full suite incl. integration-marked tests)
        run: |
          trap 'docker compose -f docker-compose.test.yml down --volumes --remove-orphans' EXIT
          docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from test-runner

  security:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lockfiles]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Block committed environment files
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.local|\.production)?$'; then
            echo "Environment files must not be committed. Use .env.example instead."
            exit 1
          fi

      - name: Set up Python for dependency resolution
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies (so Trivy resolves the full lockfile)
        working-directory: backend
        run: pip install -r requirements.lock

      - name: Set up Node.js for dependency resolution
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install frontend dependencies (so Trivy resolves node_modules)
        working-directory: frontend
        run: npm ci

      - name: pip-audit
        working-directory: backend
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.lock --no-deps

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run filesystem vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          scanners: vuln
          exit-code: "1"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  deploy:
    name: Build and publish Docker images (deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, test, docker-integration, security]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lowercase repository name for GHCR
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tags
        id: tags
        run: |
          IMAGES="ghcr.io/${{ steps.repo.outputs.name }}"
          REF_NAME="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${REF_NAME#v}"
            API_TAGS="$IMAGES/oyster360-api:$VERSION,$IMAGES/oyster360-api:latest"
            WEB_TAGS="$IMAGES/oyster360-web:$VERSION,$IMAGES/oyster360-web:latest"
          else
            SHA="${GITHUB_SHA::7}"
            API_TAGS="$IMAGES/oyster360-api:main,$IMAGES/oyster360-api:sha-$SHA"
            WEB_TAGS="$IMAGES/oyster360-web:main,$IMAGES/oyster360-web:sha-$SHA"
          fi
          {
            echo "api=$API_TAGS"
            echo "web=$WEB_TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push backend image (oyster360-api)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.api }}

      - name: Build and push frontend image (oyster360-web)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.web }}

      - name: Deployment summary
        run: |
          echo "Published deployable images:"
          echo "  ${{ steps.tags.outputs.api }}"
          echo "  ${{ steps.tags.outputs.web }}"
          echo "Point docker-compose.prod.yml at these images to roll out a release."
