name: CI

on:
  push:
    branches: [main, develop, "arena/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lockfile reproducibility.
  #
  # Hard-fails when a human-authored change leaves a lockfile out of sync.
  # On Dependabot PRs (which bump manifests but cannot regenerate uv.lock /
  # requirements.lock), the lockfiles are regenerated in-place and pushed back
  # to the Dependabot branch so the dependency update is actually installable,
  # testable, and mergeable. Dependabot pip PRs previously always failed here.
  # ---------------------------------------------------------------------------
  lockfiles:
    name: Lockfile reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push regenerated lockfiles back to Dependabot branches
    env:
      IS_DEPENDABOT: ${{ startsWith(github.head_ref, 'dependabot/') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Check out the PR head branch (not the merge ref) so regenerated
          # lockfiles can be pushed back on Dependabot PRs.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: uv lock --check (root PEP 621 manifest)
        run: |
          if ! uv lock --check; then
            if [ "$IS_DEPENDABOT" = "true" ]; then
              echo "::notice::root uv.lock out of sync with pyproject.toml (expected on Dependabot PRs); regenerating."
              uv lock
            else
              echo "::error::root uv.lock is out of sync with pyproject.toml."
              echo "Regenerate it with: uv lock"
              exit 1
            fi
          fi

      - name: uv lock --check (backend)
        working-directory: backend
        run: |
          if ! uv lock --check; then
            if [ "$IS_DEPENDABOT" = "true" ]; then
              echo "::notice::backend/uv.lock out of sync (expected on Dependabot PRs); regenerating."
              uv lock
            else
              echo "::error::backend/uv.lock does not match backend/pyproject.toml."
              echo "Regenerate it with: cd backend && uv lock"
              exit 1
            fi
          fi

      - name: Fail if backend/requirements.lock is out of sync with requirements.txt
        working-directory: backend
        run: |
          pip install pip-tools
          pip-compile --no-emit-index-url --strip-extras \
            --output-file=requirements.lock requirements.txt
          if ! git diff --exit-code -- requirements.lock; then
            if [ "$IS_DEPENDABOT" = "true" ]; then
              echo "::notice::requirements.lock regenerated to match the Dependabot bump; it will be committed to the PR branch."
            else
              echo "::error::backend/requirements.lock does not match requirements.txt."
              echo "Regenerate it with:"
              echo "  cd backend && pip-compile --no-emit-index-url --strip-extras \\"
              echo "    --output-file=requirements.lock requirements.txt"
              exit 1
            fi
          fi

      - name: Commit regenerated lockfiles to the Dependabot branch
        if: >-
          github.event_name == 'pull_request' &&
          startsWith(github.head_ref, 'dependabot/') &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock backend/uv.lock backend/requirements.lock
          if git diff --cached --quiet; then
            echo "Lockfiles already in sync; nothing to commit."
          else
            git commit -m "chore(deps): regenerate lockfiles for Dependabot update"
            git push || echo "::warning::Could not push regenerated lockfiles; continuing verification against the regenerated files."
          fi

      - name: Verify locked backend dependencies are installable from scratch
        working-directory: backend
        run: pip install --dry-run -r requirements.lock

      - name: Verify frontend lockfile matches package.json
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json || {
            echo "::error::frontend/package-lock.json does not match package.json."
            echo "Regenerate it with: cd frontend && npm install"
            exit 1
          }

  # ---------------------------------------------------------------------------
  # Backend: install locked deps, lint (flake8), typecheck (advisory mypy),
  # unit tests, and the full suite behind a pytest-cov coverage gate.
  # ---------------------------------------------------------------------------
  backend:
    name: Lint, typecheck, and test backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lockfiles]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Regenerate lockfile so Dependabot PRs test the bumped versions
        if: startsWith(github.head_ref, 'dependabot/')
        working-directory: backend
        run: |
          pip install pip-tools
          pip-compile --no-emit-index-url --strip-extras \
            --output-file=requirements.lock requirements.txt

      - name: Install locked dependencies
        working-directory: backend
        run: pip install -r requirements.lock

      - name: Lint backend (flake8; generated alembic/versions excluded)
        working-directory: backend
        run: flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,__pycache__,alembic/versions

      # Advisory until the existing findings are resolved; flip
      # continue-on-error to false once `mypy app` is clean.
      - name: Type check backend (mypy, advisory)
        working-directory: backend
        continue-on-error: true
        run: |
          pip install mypy==2.3.1
          mypy app --ignore-missing-imports --explicit-package-bases 2>&1 | tail -n 30

      - name: Run fast unit tests (no external services)
        working-directory: backend
        run: pytest -m "not integration" -q

      - name: Run backend tests with coverage gate (>= 70%)
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=70

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Frontend: npm ci, eslint, tsc --noEmit, vitest coverage gate, next build.
  # ---------------------------------------------------------------------------
  frontend:
    name: Lint, typecheck, and test frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lockfiles]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies (npm ci)
        working-directory: frontend
        run: npm ci

      - name: Lint frontend (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Typecheck frontend (tsc --noEmit)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Test frontend with coverage gate (vitest)
        working-directory: frontend
        run: npm run test:coverage

      - name: Build frontend (next build)
        working-directory: frontend
        run: npm run build

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Docker validation + full integration suite (PostgreSQL/pgvector + Redis)
  # in an isolated compose stack.
  # ---------------------------------------------------------------------------
  docker-integration:
    name: Docker build and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate production Compose configuration
        run: docker compose config --quiet

      - name: Build backend Docker image
        run: docker build -t oyster360-api:ci .

      - name: Build frontend Docker image
        run: docker build -t oyster360-web:ci ./frontend

      - name: Run isolated Compose test stack (full suite incl. integration-marked tests)
        run: |
          trap 'docker compose -f docker-compose.test.yml down --volumes --remove-orphans' EXIT
          docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from test-runner

  # ---------------------------------------------------------------------------
  # Security: secret hygiene, Python (pip-audit) + JS (npm audit) dependency
  # audits, Trivy filesystem scan published to the GitHub Security tab.
  # ---------------------------------------------------------------------------
  security:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lockfiles]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Block committed environment files
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.local|\.production)?$'; then
            echo "Environment files must not be committed. Use .env.example instead."
            exit 1
          fi

      - name: Set up Python for dependency resolution
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies (so Trivy resolves the full lockfile)
        working-directory: backend
        run: pip install -r requirements.lock

      - name: Set up Node.js for dependency resolution
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install frontend dependencies (so Trivy resolves node_modules)
        working-directory: frontend
        run: npm ci

      - name: pip-audit backend dependency tree
        working-directory: backend
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.lock --no-deps

      - name: npm audit (frontend, high and above)
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run filesystem vulnerability scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          scanners: vuln
          exit-code: "1"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # ---------------------------------------------------------------------------
  # Deploy artifacts: after every green run on main (and on v* release tags),
  # build and publish the backend and frontend images to GitHub Container
  # Registry. These images are the deployment units consumed by
  # docker-compose.prod.yml / any server pull step:
  #   ghcr.io/<owner>/<repo>/oyster360-api:<tag>
  #   ghcr.io/<owner>/<repo>/oyster360-web:<tag>
  # ---------------------------------------------------------------------------
  deploy:
    name: Build and publish Docker images (deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend, docker-integration, security]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lowercase repository name for GHCR
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tags
        id: tags
        run: |
          IMAGES="ghcr.io/${{ steps.repo.outputs.name }}"
          REF_NAME="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${REF_NAME#v}"
            API_TAGS="$IMAGES/oyster360-api:$VERSION,$IMAGES/oyster360-api:latest"
            WEB_TAGS="$IMAGES/oyster360-web:$VERSION,$IMAGES/oyster360-web:latest"
          else
            SHA="${GITHUB_SHA::7}"
            API_TAGS="$IMAGES/oyster360-api:main,$IMAGES/oyster360-api:sha-$SHA"
            WEB_TAGS="$IMAGES/oyster360-web:main,$IMAGES/oyster360-web:sha-$SHA"
          fi
          {
            echo "api=$API_TAGS"
            echo "web=$WEB_TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push backend image (oyster360-api)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.api }}

      - name: Build and push frontend image (oyster360-web)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.web }}

      - name: Deployment summary
        run: |
          echo "Published deployable images:"
          echo "  ${{ steps.tags.outputs.api }}"
          echo "  ${{ steps.tags.outputs.web }}"
          echo "Point docker-compose.prod.yml at these images to roll out a release."
