name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, "arena/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install locked dependencies
        working-directory: backend
        run: pip install -r requirements.lock

      - name: Lint backend
        working-directory: backend
        run: flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run fast unit tests (no external services)
        working-directory: backend
        run: pytest -m "not integration" -q

      - name: Test backend with coverage gate
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=60

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Test frontend with coverage gate
        working-directory: frontend
        run: npm test -- --coverage

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Validate production Compose configuration
        run: docker compose config --quiet

      - name: Run isolated Compose test stack (full suite incl. integration-marked tests)
        run: |
          trap 'docker compose -f docker-compose.test.yml down --volumes --remove-orphans' EXIT
          docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from test-runner

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Block committed environment files
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.local|\.production)?$'; then
            echo "Environment files must not be committed. Use .env.example instead."
            exit 1
          fi

      - name: Run filesystem vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"

  deploy:
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker-integration, security]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deployment placeholder
        run: echo "Configure the production deployment provider here"
