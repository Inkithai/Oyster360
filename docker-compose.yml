services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: oyster360
      POSTGRES_PASSWORD: oyster360_secure_pass
      POSTGRES_DB: oyster360
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oyster360 -d oyster360"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: oyster360-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://oyster360:oyster360_secure_pass@postgres:5432/oyster360
    restart: "no"

  backend:
    image: oyster360-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://oyster360:oyster360_secure_pass@postgres:5432/oyster360
      REDIS_URL: redis://redis:6379/0
    restart: unless-stopped

  celery-worker:
    image: oyster360-backend:local
    command: ["celery", "-A", "app.core.celery:celery_app", "worker", "--loglevel=info"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://oyster360:oyster360_secure_pass@postgres:5432/oyster360
      REDIS_URL: redis://redis:6379/0
    restart: unless-stopped

  celery-beat:
    image: oyster360-backend:local
    command: ["celery", "-A", "app.core.celery:celery_app", "beat", "--loglevel=info"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://oyster360:oyster360_secure_pass@postgres:5432/oyster360
      REDIS_URL: redis://redis:6379/0
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
    restart: unless-stopped

volumes:
  postgres_data:
