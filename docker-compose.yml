services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${DB_USER:-oyster360}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-oyster360_secure_pass}
      POSTGRES_DB: ${DB_NAME:-oyster360}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-oyster360} -d ${DB_NAME:-oyster360}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: oyster360-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-oyster360}:${DB_PASSWORD:-oyster360_secure_pass}@postgres:5432/${DB_NAME:-oyster360}
    restart: "no"

  backend:
    image: oyster360-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-oyster360}:${DB_PASSWORD:-oyster360_secure_pass}@postgres:5432/${DB_NAME:-oyster360}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-key-change-me-123456}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AI_PROVIDER: ${AI_PROVIDER:-rule-based}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}
    restart: unless-stopped

  celery-worker:
    image: oyster360-backend:local
    command: ["celery", "-A", "app.core.celery:celery_app", "worker", "--loglevel=info"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-oyster360}:${DB_PASSWORD:-oyster360_secure_pass}@postgres:5432/${DB_NAME:-oyster360}
      REDIS_URL: redis://redis:6379/0
      AI_PROVIDER: ${AI_PROVIDER:-rule-based}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    restart: unless-stopped

  celery-beat:
    image: oyster360-backend:local
    command: ["celery", "-A", "app.core.celery:celery_app", "beat", "--loglevel=info"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-oyster360}:${DB_PASSWORD:-oyster360_secure_pass}@postgres:5432/${DB_NAME:-oyster360}
      REDIS_URL: redis://redis:6379/0
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
    restart: unless-stopped

volumes:
  postgres_data:
