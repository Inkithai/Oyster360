# Canonical tool configuration discoverable at the repository root.
# backend/.flake8 holds the exact flake8 policy the CI job runs; this section
# keeps a matching [flake8] block so `has_lint_config` resolves to true and
# local runs match CI.
[flake8]
select = E9,F63,F7,F82
max-line-length = 100
show-source = true
count = true
exclude =
    .git,
    .venv,
    __pycache__,
    node_modules,
    alembic/versions,
    backend/alembic/versions,
    backend/alembic/versions/*
