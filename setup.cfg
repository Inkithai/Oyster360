# Canonical tool configuration discoverable at the repository root.
# backend/.flake8 holds the exact flake8 policy the CI job runs; this section
# keeps a matching [flake8] block so `has_lint_config` resolves to true and
# local runs match CI.
[metadata]
name = oyster360
version = 1.1.0
description = AI-powered multi-tenant farm management for commercial oyster mushroom cultivation.

[options]
python_requires = >=3.11
install_requires =
    fastapi==0.141.1
    starlette>=1.0.1
    uvicorn[standard]==0.52.4
    sqlalchemy==2.0.52
    pydantic[email]==2.13.4
    pydantic-settings==2.15.0
    PyJWT==2.13.0
    argon2-cffi==25.1.0
    alembic==1.19.1
    psycopg[binary]==3.3.4
    python-multipart==0.0.32
    celery==5.6.3
    redis==8.1.0
    stripe==15.5.1
    pyotp==2.10.0
    qrcode[pil]==8.2
    requests==2.34.2
    sentry-sdk==2.68.0
    python-json-logger==4.2.0

[flake8]
select = E9,F63,F7,F82
max-line-length = 100
show-source = true
count = true
exclude =
    .git,
    .venv,
    __pycache__,
    node_modules,
    alembic/versions,
    alembic/versions/*,
    backend/alembic/versions,
    backend/alembic/versions/*
