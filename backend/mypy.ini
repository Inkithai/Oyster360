; Static type-checking policy for the Oyster360 backend.
;
; CI runs `mypy app` from this directory and the job FAILS on any error, so the
; check is a real gate rather than advisory output.
;
; SQLAlchemy 1.x-style `Column[...]` attributes are not descriptor-typed, so the
; ORM-heavy modules listed at the bottom still report false positives. Instead of
; disabling mypy globally, those modules are listed explicitly as a shrinking
; baseline: new modules are type-checked from day one, and the list is trimmed as
; models migrate to `Mapped[...]` annotations. Do not add entries without a
; matching migration note in CHANGELOG.md.
;
; Baseline size: 28 modules (was 36). Modules removed so far are listed in
; CHANGELOG.md under "Changed".
[mypy]
python_version = 3.11
ignore_missing_imports = True
explicit_package_bases = True
namespace_packages = True
warn_unused_configs = True
warn_redundant_casts = True
no_implicit_optional = True
check_untyped_defs = False
exclude = (?x)(^alembic/|^tests/)

; ---------------------------------------------------------------------------
; Baseline: modules awaiting the SQLAlchemy `Mapped[...]` migration.
; ---------------------------------------------------------------------------
[mypy-app.api.ai_assistant]
ignore_errors = True

[mypy-app.api.assistant]
